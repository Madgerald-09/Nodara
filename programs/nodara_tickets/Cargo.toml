[package]
name = "nodara_tickets"
version = "0.1.0"
description = "Devnet program-controlled NODARA ticket ownership"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nodara_tickets"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "=0.30.1"
# Anchor 0.30 IDL generation uses Span::source_file, removed in proc-macro2 1.0.95.
proc-macro2 = "=1.0.94"
